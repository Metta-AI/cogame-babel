name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use 2.2.4
          "$HOME/.local/bin/nimby" --global sync nimby.lock
          for pkg in "$HOME"/.nimby/pkgs/*; do
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg
      - name: Test rules, private views, and player policies
        run: |
          set -euo pipefail
          for test in tests/*.nim; do
            nim c --parallelBuild:1 -r --path:src "$test"
            nim c --parallelBuild:1 -r -d:release --path:src "$test"
          done
      - name: Test numeric and production language training bridge
        run: |
          set -euo pipefail
          nim c --parallelBuild:1 -d:release --path:src -o:/tmp/babel-train-bridge tools/train_bridge.nim
          python3 tools/test_train_bridge.py /tmp/babel-train-bridge

      - name: Verify real private trajectory capture and fallback attribution
        run: |
          set -euo pipefail
          nim c --parallelBuild:1 -d:release --path:src -o:/tmp/babel-game src/babel.nim
          nim c --parallelBuild:1 -d:release --path:src -o:/tmp/babel-player src/babel_player.nim
          python3 tools/test_hosted_trajectory.py /tmp/babel-game /tmp/babel-player
          nim c --parallelBuild:1 -d:release --path:src -o:/tmp/babel-origin-player tests/support/attempt_origin_player.nim
          python3 tools/test_attempt_origins.py /tmp/babel-game /tmp/babel-origin-player
          python3 tools/test_native_lifecycle.py /tmp/babel-game /tmp/babel-player /tmp/babel-native-lifecycle

  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build images and static replay viewer
        run: uvx --from 'coworld[auth]==0.1.56' coworld build --version 0.1.4
      - name: Certify bundled prompt and scripted seats locally
        run: uvx --from 'coworld[auth]==0.1.56' coworld certify --timeout-seconds 300 --no-open-report dist/coworld_manifest.json
